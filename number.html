<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎉 Results Are Out!</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <style>
        /* ── All styles remain unchanged ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a080c;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            margin: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.03) 0px,
                    rgba(0, 0, 0, 0.03) 2px,
                    transparent 2px,
                    transparent 6px);
            animation: scanMove 8s linear infinite;
        }

        @keyframes scanMove {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 10px;
            }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 40%, rgba(255, 200, 0, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 60%, rgba(255, 0, 80, 0.10) 0%, transparent 50%),
                #0a080c;
            animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
            animation: floatOrb 8s ease-in-out infinite alternate;
        }
        .orb--1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            background: #ffaa00;
            animation-delay: 0s;
        }
        .orb--2 {
            width: 350px;
            height: 350px;
            bottom: -100px;
            right: -100px;
            background: #ff0040;
            animation-delay: 3s;
        }
        .orb--3 {
            width: 250px;
            height: 250px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #7a00ff;
            animation-delay: 6s;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -40px) scale(1.2);
            }
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            background: rgba(10, 8, 12, 0.8);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 3rem;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 200, 0, 0.15);
            box-shadow:
                0 0 60px rgba(255, 200, 0, 0.05),
                0 30px 80px rgba(0, 0, 0, 0.8);
            transition: box-shadow 0.3s ease;
        }

        .card.glow-gold {
            border-color: rgba(255, 200, 0, 0.3);
            box-shadow: 0 0 80px rgba(255, 200, 0, 0.1), 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .badge {
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 100px;
            background: rgba(255, 200, 0, 0.12);
            border: 1px solid rgba(255, 200, 0, 0.2);
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ffd700;
            margin-bottom: 1.2rem;
            backdrop-filter: blur(4px);
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
            text-transform: uppercase;
        }

        h1 span {
            background: linear-gradient(135deg, #ffd700, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 200, 0, 0.2);
        }

        .subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: rgba(255, 200, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.05);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border-radius: 1.5rem;
            border: none;
            background: linear-gradient(135deg, rgba(255, 200, 0, 0.15), rgba(255, 100, 0, 0.15));
            border: 1px solid rgba(255, 200, 0, 0.2);
            color: #ffd700;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, rgba(255, 200, 0, 0.25), rgba(255, 100, 0, 0.25));
            border-color: rgba(255, 200, 0, 0.4);
            box-shadow: 0 0 40px rgba(255, 200, 0, 0.05);
            transform: scale(1.01);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .result-area {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: none;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }

        .result-area.visible {
            display: block;
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .result-badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 100px;
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.8rem;
        }

        .result-badge.topper {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
        }
        .result-badge.good {
            background: rgba(52, 211, 153, 0.15);
            border: 1px solid rgba(52, 211, 153, 0.3);
            color: #34d399;
        }
        .result-badge.average {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }
        .result-badge.below {
            background: rgba(251, 146, 60, 0.15);
            border: 1px solid rgba(251, 146, 60, 0.3);
            color: #fb923c;
        }
        .result-badge.fail {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .result-meme {
            font-size: clamp(1.4rem, 3.5vw, 2.6rem);
            font-weight: 800;
            color: #fff;
            line-height: 1.3;
            margin: 0.5rem 0 0.8rem 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .result-meme .emoji {
            font-size: clamp(2rem, 4vw, 3rem);
            display: block;
            margin-bottom: 0.3rem;
        }

        .result-details {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.05em;
        }

        .result-details strong {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
        }

        .confetti-container {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 1.8rem 1.2rem;
                border-radius: 2rem;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .result-meme {
                font-size: 1.2rem;
            }
        }

        .text-center {
            text-align: center;
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Floating Orbs -->
    <div class="orb orb--1" aria-hidden="true"></div>
    <div class="orb orb--2" aria-hidden="true"></div>
    <div class="orb orb--3" aria-hidden="true"></div>

    <!-- Confetti Container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Main Card -->
    <main class="card" id="mainCard" role="main">
        <div class="badge">🎉 RESULTS</div>

        <h1>
            Your <span>Moment</span>
        </h1>
        <p class="subtitle">Enter your details to reveal your fate</p>

        <!-- Form -->
        <form id="resultForm">
            <div class="form-group">
                <label for="studentName">Your Name</label>
                <input type="text" id="studentName" placeholder="e.g. John Doe" required />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber" placeholder="e.g. 2024-01" required />
                </div>
                <div class="form-group">
                    <label for="marks">Marks (0-555)</label>
                    <input type="number" id="marks" placeholder="e.g. 455" min="0" max="555" required />
                </div>
            </div>

            <button type="submit" class="btn-submit">🔮 Reveal My Result</button>
        </form>

        <!-- Result Area -->
        <div class="result-area" id="resultArea">
            <div class="text-center">
                <span class="result-badge" id="resultBadge">★ TOPPER</span>
            </div>
            <div class="result-meme text-center" id="resultMeme">
                <span class="emoji">🧠</span>
                You are the Einstein of this class!
            </div>
            <div class="result-details text-center" id="resultDetails">
                <strong id="resultName">John Doe</strong> &nbsp;·&nbsp; Roll: <strong id="resultRoll">2024-01</strong> &nbsp;·&nbsp; Marks: <strong id="resultMarks">455</strong> / 555
                <span style="display:block; margin-top:0.2rem; color:rgba(255,255,255,0.15); font-size:0.6rem;" id="resultPercent">82%</span>
            </div>
        </div>
    </main>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const form = document.getElementById('resultForm');
            const nameInput = document.getElementById('studentName');
            const rollInput = document.getElementById('rollNumber');
            const marksInput = document.getElementById('marks');
            const resultArea = document.getElementById('resultArea');
            const resultBadge = document.getElementById('resultBadge');
            const resultMeme = document.getElementById('resultMeme');
            const resultName = document.getElementById('resultName');
            const resultRoll = document.getElementById('resultRoll');
            const resultMarks = document.getElementById('resultMarks');
            const resultPercent = document.getElementById('resultPercent');
            const card = document.getElementById('mainCard');
            const confettiContainer = document.getElementById('confettiContainer');

            // ─── Constants ───
            const TOTAL_MARKS = 555;

            // ─── Meme Database ───
            const memes = {
                topper: {
                    badge: '★ TOPPER',
                    badgeClass: 'topper',
                    messages: [
                        { emoji: '🧠', text: 'You are the Einstein of this class!' },
                        { emoji: '🤯', text: 'Did you even study? Or are you just that smart?' },
                        { emoji: '🎓', text: 'Congratulations! You made the teachers proud!' },
                        { emoji: '🤓', text: 'You have achieved a level of intelligence that is... concerning.' },
                        { emoji: '🔥', text: 'You are on fire! Someone call the fire department!' },
                        { emoji: '👑', text: 'King/Queen of the class! Bow down!' }
                    ]
                },
                good: {
                    badge: '👍 GOOD JOB',
                    badgeClass: 'good',
                    messages: [
                        { emoji: '😊', text: 'Not bad, not bad at all. You actually studied!' },
                        { emoji: '📚', text: 'You are the "good" kind of student. Teachers remember you.' },
                        { emoji: '🚀', text: 'Nice! You are on the right track. Keep it up!' },
                        { emoji: '😅', text: 'You are the reason the class average is not in the gutter.' },
                        { emoji: '💪', text: 'Solid effort! You are the backbone of this class.' }
                    ]
                },
                average: {
                    badge: '😐 AVERAGE',
                    badgeClass: 'average',
                    messages: [
                        { emoji: '🤷', text: 'Meh. You are the "average" kind of special.' },
                        { emoji: '🍞', text: 'You are like plain toast. Not bad, but not exciting either.' },
                        { emoji: '😴', text: 'The classic "I studied the night before" result.' },
                        { emoji: '😬', text: 'You are the "C" student. And that is... okay?' },
                        { emoji: '🎯', text: 'You hit the middle. Perfectly average. Congrats?' }
                    ]
                },
                below: {
                    badge: '😬 BELOW AVERAGE',
                    badgeClass: 'below',
                    messages: [
                        { emoji: '📄', text: 'Did you even read the question paper?' },
                        { emoji: '📉', text: 'You are the reason the bell curve exists.' },
                        { emoji: '😬', text: 'Oof. That is... something.' },
                        { emoji: '👻', text: 'Your marks are like a horror movie. Scary and full of regret.' },
                        { emoji: '🤦', text: 'Facepalm. That is all I can say.' }
                    ]
                },
                fail: {
                    badge: '💀 FAIL',
                    badgeClass: 'fail',
                    messages: [
                        { emoji: '😅', text: 'Better luck next time. Or never. Your choice.' },
                        { emoji: '🎉', text: 'You have failed successfully! (just kidding)' },
                        { emoji: '🤡', text: 'You are the "F" in "Fun". But not in a good way.' },
                        { emoji: '😭', text: 'Congratulations! You are officially the class clown.' },
                        { emoji: '☠️', text: 'RIP your grades. They had a good run.' }
                    ]
                }
            };

            // ─── Sound Engine ───
            let audioCtx = null;

            function getAudioContext() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                return audioCtx;
            }

            function playResultSound(category) {
                try {
                    const ctx = getAudioContext();
                    if (ctx.state === 'suspended') ctx.resume();

                    const now = ctx.currentTime;

                    switch (category) {
                        case 'topper':
                            playFanfare(ctx, now);
                            break;
                        case 'good':
                            playHappyChord(ctx, now);
                            break;
                        case 'average':
                            playMehSound(ctx, now);
                            break;
                        case 'below':
                            playSadTrombone(ctx, now);
                            break;
                        case 'fail':
                            playFailSound(ctx, now);
                            break;
                    }
                } catch (e) {}
            }

            function playFanfare(ctx, startTime) {
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.12, startTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + i * 0.1 + 0.2);
                    osc.start(startTime + i * 0.1);
                    osc.stop(startTime + i * 0.1 + 0.2);
                });
            }

            function playHappyChord(ctx, startTime) {
                const freqs = [523, 659, 784];
                freqs.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, startTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + i * 0.08 + 0.3);
                    osc.start(startTime + i * 0.08);
                    osc.stop(startTime + i * 0.08 + 0.3);
                });
            }

            function playMehSound(ctx, startTime) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.value = 300;
                gain.gain.setValueAtTime(0.08, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            }

            function playSadTrombone(ctx, startTime) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, startTime);
                osc.frequency.linearRampToValueAtTime(200, startTime + 0.5);
                gain.gain.setValueAtTime(0.1, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);
                osc.start(startTime);
                osc.stop(startTime + 0.5);
            }

            function playFailSound(ctx, startTime) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const wah = ctx.createBiquadFilter();
                osc.connect(wah);
                wah.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, startTime);
                osc.frequency.linearRampToValueAtTime(150, startTime + 0.7);
                wah.type = 'lowpass';
                wah.frequency.setValueAtTime(800, startTime);
                wah.frequency.linearRampToValueAtTime(200, startTime + 0.7);
                wah.Q.value = 10;
                gain.gain.setValueAtTime(0.12, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.7);
                osc.start(startTime);
                osc.stop(startTime + 0.7);
            }

            // ─── Confetti ───
            function fireConfetti(count = 80) {
                const colors = ['#ffd700', '#ff6b00', '#ff0040', '#7a00ff', '#34d399', '#fbbf24', '#ff4d7a', '#00c8ff'];
                const container = confettiContainer;

                for (let i = 0; i < count; i++) {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.style.left = Math.random() * 100 + '%';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = (Math.random() * 6 + 4) + 'px';
                    el.style.height = (Math.random() * 6 + 4) + 'px';
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    el.style.animationDelay = (Math.random() * 1.5) + 's';
                    container.appendChild(el);
                }

                setTimeout(() => {
                    container.innerHTML = '';
                }, 5000);
            }

            // ─── Form Submission ───
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const name = nameInput.value.trim() || 'Anonymous';
                const roll = rollInput.value.trim() || 'N/A';
                const marks = parseFloat(marksInput.value);

                if (isNaN(marks) || marks < 0 || marks > TOTAL_MARKS) {
                    alert(`Please enter valid marks between 0 and ${TOTAL_MARKS}.`);
                    return;
                }

                // Calculate percentage
                const percent = (marks / TOTAL_MARKS) * 100;
                let category;
                if (percent >= 90) category = 'topper';
                else if (percent >= 75) category = 'good';
                else if (percent >= 50) category = 'average';
                else if (percent >= 35) category = 'below';
                else category = 'fail';

                const memePool = memes[category].messages;
                const selectedMeme = memePool[Math.floor(Math.random() * memePool.length)];

                resultBadge.textContent = memes[category].badge;
                resultBadge.className = 'result-badge ' + memes[category].badgeClass;
                resultMeme.innerHTML = `<span class="emoji">${selectedMeme.emoji}</span> ${selectedMeme.text}`;
                resultName.textContent = name;
                resultRoll.textContent = roll;
                resultMarks.textContent = marks;
                resultPercent.textContent = Math.round(percent) + '%';

                resultArea.classList.remove('visible');
                void resultArea.offsetWidth;
                resultArea.classList.add('visible');

                card.classList.add('glow-gold');

                playResultSound(category);

                if (category === 'topper') {
                    fireConfetti(120);
                } else if (category === 'good') {
                    fireConfetti(40);
                }
            });

            // ─── Unlock Audio ───
            document.addEventListener('click', function unlockAudio() {
                try {
                    const ctx = getAudioContext();
                    if (ctx.state === 'suspended') ctx.resume();
                } catch (e) {}
                document.removeEventListener('click', unlockAudio);
            }, { once: true });

            console.log('🎉 Result page loaded. Total marks = 555. Enter your details!');
        })();
    </script>

</body>
</html>
